name: Build Shinzi APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install NPM Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android Debug APK
        working-directory: android
        run: |
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK Output
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/Shinzi.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shinzi-App-APK
          path: build-output/Shinzi.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-apk
          name: Shinzi Android App v1.0.0
          body: |
            ### 🚀 Shinzi Android App (.apk)
            
            - **Native Android APK** with custom swirl icon.
            - **Zero Chrome marks, zero URL bars.**
            - **Real Android notifications with Reply action.**
            - **Live Sync**: Automatically updates from Vercel without needing to re-install.
          files: build-output/Shinzi.apk
          token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
