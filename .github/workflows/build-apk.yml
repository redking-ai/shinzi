name: Build Shinzi Apps (Android APK & Windows EXE)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install NPM Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2.1'

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Verify Permanent Release Keystore
        run: |
          if [ ! -f android/app/shinzi-release.jks ]; then
            echo "Error: Permanent release keystore missing!"
            exit 1
          fi
          keytool -list -keystore android/app/shinzi-release.jks -alias shinzi -storepass shinzi123

      - name: Build Android Release APK
        working-directory: android
        run: |
          gradle wrapper --gradle-version 8.2.1
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Rename APK Output
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/release/app-release.apk build-output/Shinzi.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shinzi-App-APK
          path: build-output/Shinzi.apk

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-apk
          name: Shinzi v1.0.0 (Android APK & Windows Desktop)
          body: |
            ### 🚀 Shinzi Multi-Platform Release

            - **📱 Shinzi Android App (`Shinzi.apk`)**: Native Android APK with live sync, native notifications & reply actions.
            - **💻 Shinzi Windows Desktop App (`Shinzi-Setup.exe`)**: Native Windows Electron desktop client with live sync, desktop UI, and audio notifications.
          files: build-output/Shinzi.apk
          token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  build-desktop:
    name: Build Windows Desktop EXE
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install NPM Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Build Windows Desktop Installer (.exe)
        run: npx electron-builder --win --x64

      - name: Upload Desktop Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shinzi-Desktop-EXE
          path: build-desktop/*.exe

      - name: Add Windows Desktop EXE to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-apk
          files: build-desktop/*.exe
          token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
